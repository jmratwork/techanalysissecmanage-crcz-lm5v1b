- phase: "Topology import"
  steps:
    - action: "upload_topology"
      file: topology.yml
      notes: "Load hosts, networks, and router definitions for the training subnet."
- phase: "Base provisioning"
  steps:
    - action: "run_playbook"
      playbook: provisioning/playbook.yml
      notes: "Install required packages across all nodes, including NG‑SOC services and trainee workstation tools."
- phase: "Service validation"
  steps:
    - action: "check_ports"
      targets:
        - host: training-platform
          ports: [22, 80]
        - host: trainee-workstation
          ports: [22]
        - host: cyber-range
          ports: [22, 8000]
        - host: randomization-platform
          ports: [22, 8500]
        - host: bips
          ports: [22, 8600]
        - host: ng-siem
          ports: [22, 8700]
        - host: cicms
          ports: [22, 8800]
        - host: ng-soar
          ports: [22, 8900]
      notes: "Ensure core services listen on the expected ports after provisioning."
- phase: "Workshop handoff"
  steps:
    - action: "record_notes"
      fields:
        - label: "Course name"
          default: "pentest-101"
        - label: "Instructor contact"
        - label: "Range access URL"
      notes: "Capture quick-reference metadata before publishing the sandbox."
