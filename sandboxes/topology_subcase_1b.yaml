---
# KYPO/CyberRangeCZ naming guard:
# - Keep host/router/network identifiers in kebab-case.
# - Keep service `name` values in kebab-case.
# This prevents validation errors like: "Cannot set <X>.name".
name: "subcase-1b-topology"
hosts:
  training-platform:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.2
    services:
      - name: ssh
        port: 22
      - name: course-web
        port: 80
  trainee-workstation:
    image: kali
    flavor: small
    interfaces:
      - network: training-net
        ip: 10.10.0.3
    services:
      - name: ssh
        port: 22
  cyber-range:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.4
    services:
      - name: ssh
        port: 22
      - name: dvwa
        port: 8000
  randomization-platform:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.5
    services:
      - name: ssh
        port: 22
      - name: randomization-eval
        port: 8500
  bips:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.6
    services:
      - name: ssh
        port: 22
      - name: bips
        port: 8600
  ng-siem:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.7
    services:
      - name: ssh
        port: 22
      - name: siem
        port: 8700
  cicms:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.8
    services:
      - name: ssh
        port: 22
      - name: incident-mgmt
        port: 8800
  ng-soar:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.9
    services:
      - name: ssh
        port: 22
      - name: soar
        port: 8900
routers:
  router:
    interfaces:
      - network: training-net
        ip: 10.10.0.1
networks:
  # NOTE: Keep this network key in kebab-case for KYPO validation.
  training-net:
    prefix: 10.10.0.0/24
base_box:
  image: debian-12-x86_64
  users:
    - username: kypo
      password: kypo
