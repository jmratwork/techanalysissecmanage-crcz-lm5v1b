---
# KYPO/CyberRangeCZ naming guard:
# - Keep host/router/network identifiers in kebab-case.
# - Keep service `name` values in kebab-case.
# This prevents validation errors like: "Cannot set <X>.name".
name: "subcase-1b-topology"
hosts:
  training-platform:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.200
    services:
      - name: ssh
        port: 22
      - name: course-web
        port: 80
  trainee-workstation:
    image: kali
    flavor: small
    interfaces:
      - network: training-net
        ip: 10.10.0.201
    services:
      - name: ssh
        port: 22
  cyber-range:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.202
    services:
      - name: ssh
        port: 22
      - name: dvwa
        port: 8000
  randomization-platform:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.203
    services:
      - name: ssh
        port: 22
      - name: randomization-eval
        port: 8500
  bips:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.204
    services:
      - name: ssh
        port: 22
      - name: bips
        port: 8600
  ng-siem:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.205
    services:
      - name: ssh
        port: 22
      - name: siem
        port: 8700
  cicms:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.206
    services:
      - name: ssh
        port: 22
      - name: incident-mgmt
        port: 8800
  ng-soar:
    image: debian-12-x86_64
    flavor: medium
    interfaces:
      - network: training-net
        ip: 10.10.0.207
    services:
      - name: ssh
        port: 22
      - name: soar
        port: 8900
routers:
  router:
    interfaces:
      - network: training-net
        ip: 10.10.0.1
networks:
  # NOTE: Keep this network key in kebab-case for KYPO validation.
  training-net:
    prefix: 10.10.0.0/24
    gateway_ip: 10.10.0.1
    allocation_pool:
      start: 10.10.0.20
      end: 10.10.0.199
base_box:
  image: debian-12-x86_64
  users:
    - username: kypo
      password: kypo
