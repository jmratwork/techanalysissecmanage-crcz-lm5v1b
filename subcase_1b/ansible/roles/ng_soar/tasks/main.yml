- name: Manage NG-SOAR component
  when: ng_soar_enabled | bool
  become: yes
  block:
    - name: Validate NG-SOAR installation parameters
      ansible.builtin.assert:
        that:
          - ng_soar_install_method in ['deb', 'docker']
          - ng_soar_install_method != 'deb' or ng_soar_repo_url | length > 0
          - ng_soar_install_method != 'deb' or ng_soar_package_path | length > 0
          - ng_soar_install_method != 'deb' or ng_soar_package_checksum | length > 0
          - ng_soar_install_method != 'docker' or ng_soar_docker_enabled | bool
          - ng_soar_install_method != 'docker' or ng_soar_docker_project_src | length > 0
        fail_msg: >-
          NG-SOAR prerequisites failed. Validate install_method and required package/Docker variables, and provide non-placeholder docker_image/docker_tag values via inventory/group_vars.

    - name: NG-SOAR deb installation flow
      when: ng_soar_install_method == 'deb'
      block:
        - name: Optionally validate NG-SOAR repository connectivity
          ansible.builtin.uri:
            url: "{{ ng_soar_repo_url }}"
            method: HEAD
            status_code: [200, 301, 302]
          when: ng_soar_check_connectivity | bool

        - name: Check free space for NG-SOAR package download
          ansible.builtin.command:
            cmd: "df --output=avail -k /tmp"
          changed_when: false
          register: ng_soar_tmp_df

        - name: Validate free space threshold for NG-SOAR
          ansible.builtin.assert:
            that:
              - (ng_soar_tmp_df.stdout_lines[-1] | int) >= (ng_soar_min_free_kb | int)
            fail_msg: "Not enough free disk space in /tmp for NG-SOAR package download"

        - name: Download NG-SOAR package
          ansible.builtin.get_url:
            url: "{{ ng_soar_repo_url ~ ng_soar_package_path }}"
            dest: "{{ ng_soar_package_tmp_path }}"
            mode: "0644"
            checksum: "{{ ng_soar_package_checksum }}"

        - name: Install NG-SOAR
          ansible.builtin.apt:
            deb: "{{ ng_soar_package_tmp_path }}"
            state: present

        - name: Configure NG-SOAR
          ansible.builtin.template:
            src: ng_soar.conf.j2
            dest: "{{ ng_soar_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart ng_soar service

        - name: Deploy NG-SOAR dashboard
          ansible.builtin.template:
            src: ngsoar-dashboard.ndjson.j2
            dest: "{{ ng_soar_dashboard_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart ng_soar service

        - name: Enable and start NG-SOAR service
          ansible.builtin.service:
            name: "{{ ng_soar_service_name }}"
            state: started
            enabled: yes

    - name: NG-SOAR docker installation flow
      when: ng_soar_install_method == 'docker'
      block:
        - name: Validate NG-SOAR Docker prerequisites
          ansible.builtin.assert:
            that:
              - ng_soar_docker_project_src | length > 0
              - ng_soar_docker_compose_template | length > 0
              - ng_soar_docker_env_template | length > 0
              - ng_soar_docker_networks is iterable
              - ng_soar_docker_wait_for is iterable
              - ng_soar_docker_image | length > 0
              - ng_soar_docker_tag | length > 0
              - ng_soar_docker_image != '__REQUIRED_DOCKER_IMAGE__'
              - ng_soar_docker_tag != '__REQUIRED_DOCKER_TAG__'
            fail_msg: >-
              NG-SOAR Docker prerequisites failed. Validate project path, templates, networks and wait_for variables, and provide non-placeholder docker_image/docker_tag values via inventory/group_vars.

        - name: Ensure NG-SOAR Docker project directory exists
          ansible.builtin.file:
            path: "{{ ng_soar_docker_project_src }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Render NG-SOAR Docker compose file
          ansible.builtin.template:
            src: "{{ ng_soar_docker_compose_template }}"
            dest: "{{ ng_soar_docker_project_src }}/docker-compose.yml"
            owner: root
            group: root
            mode: '0644'

        - name: Render NG-SOAR Docker env file
          ansible.builtin.template:
            src: "{{ ng_soar_docker_env_template }}"
            dest: "{{ ng_soar_docker_project_src }}/.env"
            owner: root
            group: root
            mode: '0640'

        - name: Ensure NG-SOAR Docker networks exist
          community.docker.docker_network:
            name: "{{ item }}"
            state: present
          loop: "{{ ng_soar_docker_networks | default([]) }}"

        - name: Deploy NG-SOAR Docker stack
          community.docker.docker_compose_v2:
            project_src: "{{ ng_soar_docker_project_src }}"
            state: present
          register: ng_soar_docker_compose_result

        - name: Wait for NG-SOAR Docker endpoints
          ansible.builtin.wait_for:
            host: "{{ item.host | default('127.0.0.1') }}"
            port: "{{ item.port }}"
            timeout: "{{ item.timeout | default(120) }}"
          loop: "{{ ng_soar_docker_wait_for | default([]) }}"
          when: (ng_soar_docker_wait_for | default([])) | length > 0

        - name: Validate NG-SOAR Docker health endpoint
          ansible.builtin.uri:
            url: "{{ ng_soar_docker_healthcheck_url }}"
            method: "{{ ng_soar_docker_healthcheck_method }}"
            status_code: "{{ ng_soar_docker_healthcheck_status | default([200]) }}"
            validate_certs: "{{ ng_soar_docker_healthcheck_validate_certs }}"
          register: ng_soar_docker_healthcheck_result
          retries: "{{ ng_soar_docker_healthcheck_retries }}"
          delay: "{{ ng_soar_docker_healthcheck_delay }}"
          until: ng_soar_docker_healthcheck_result is succeeded
          when: (ng_soar_docker_healthcheck_url | default('')) | length > 0

        - name: Debug NG-SOAR deployment summary
          ansible.builtin.debug:
            msg:
              service: NG-SOAR
              method: "{{ ng_soar_install_method }}"
              compose_path: "{{ ng_soar_docker_project_src }}/docker-compose.yml"
              compose_result: "{{ ng_soar_docker_compose_result.actions | default(ng_soar_docker_compose_result.changed) }}"
