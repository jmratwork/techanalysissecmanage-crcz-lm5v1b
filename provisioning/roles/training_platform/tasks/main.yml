---
- name: Install training platform runtime dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - python3
      - python3-venv
    state: present
    update_cache: yes

- name: Check training platform requirements file
  ansible.builtin.stat:
    path: "{{ training_platform_requirements_file }}"
  register: training_platform_requirements

- name: Assert training platform requirements file exists
  ansible.builtin.assert:
    that:
      - training_platform_requirements.stat.exists
      - training_platform_requirements.stat.isreg
    fail_msg: >-
      requirements.txt no existe en {{ training_platform_requirements_file }}.
      Este rol no copia código: define training_platform_app_dir con la ruta real del repo.

- name: Check training platform application entrypoint
  ansible.builtin.stat:
    path: "{{ training_platform_entrypoint }}"
  register: training_platform_app

- name: Assert training platform app entrypoint exists
  ansible.builtin.assert:
    that:
      - training_platform_app.stat.exists
      - training_platform_app.stat.isreg
    fail_msg: >-
      app.py no existe en {{ training_platform_entrypoint }}.
      Este rol no copia código: define training_platform_app_dir con la ruta real del repo.

- name: Assert Open edX integration variables
  ansible.builtin.assert:
    that:
      - training_platform_openedx_url | length > 0
      - (training_platform_openedx_api_token | length > 0) or (training_platform_openedx_session_cookie | length > 0)
    fail_msg: >-
      Open edX está habilitado pero faltan variables críticas.
      Requiere training_platform_openedx_url y al menos una credencial
      (training_platform_openedx_api_token o training_platform_openedx_session_cookie).
  when: training_platform_openedx_enabled | bool

- name: Assert MISP integration variables
  ansible.builtin.assert:
    that:
      - training_platform_misp_url | length > 0
      - training_platform_misp_api_key | length > 0
    fail_msg: >-
      MISP está habilitado pero faltan variables críticas.
      Requiere training_platform_misp_url y training_platform_misp_api_key.
  when: training_platform_misp_enabled | bool

- name: Assert KYPO integration variables
  ansible.builtin.assert:
    that:
      - training_platform_kypo_url | length > 0
    fail_msg: >-
      KYPO está habilitado pero falta training_platform_kypo_url.
  when: training_platform_kypo_enabled | bool

- name: Assert LTI integration variables
  ansible.builtin.assert:
    that:
      - training_platform_lti_tool_private_key | length > 0
      - training_platform_lti_client_id | length > 0
      - training_platform_lti_deployment_id | length > 0
    fail_msg: >-
      LTI está habilitado pero faltan variables críticas.
      Requiere training_platform_lti_tool_private_key,
      training_platform_lti_client_id y training_platform_lti_deployment_id.
  when: training_platform_lti_enabled | bool

- name: Install python requirements in virtualenv
  ansible.builtin.pip:
    requirements: "{{ training_platform_requirements_file }}"
    virtualenv: "{{ training_platform_venv_path }}"
    virtualenv_command: python3 -m venv
    state: present
  notify: restart training platform service

- name: Configure training platform environment file
  ansible.builtin.template:
    src: training_platform.env.j2
    dest: "{{ training_platform_env_file }}"
    owner: root
    group: root
    mode: '0640'
  notify: restart training platform service

- name: Configure training platform systemd unit
  ansible.builtin.template:
    src: training_platform.service.j2
    dest: "/etc/systemd/system/{{ training_platform_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd daemon
    - restart training platform service

- name: Configure nginx vhost for training platform
  ansible.builtin.template:
    src: training_platform.nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ training_platform_nginx_site }}"
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable nginx vhost for training platform
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ training_platform_nginx_site }}"
    dest: "/etc/nginx/sites-enabled/{{ training_platform_nginx_site }}"
    state: link
  notify: reload nginx

- name: Disable default nginx vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure training platform service is enabled and started
  ansible.builtin.service:
    name: "{{ training_platform_service_name }}"
    state: started
    enabled: yes

- name: Ensure nginx service is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
