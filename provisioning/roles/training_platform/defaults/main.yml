---
# Code strategy for training_platform:
# - assert_present (default): Requires that the code already exists on the remote host.
# - sync_from_repo: sync code from the local repository (controller) to the remote host.
# Note: canonical CRCZ subcase_1b flow should override this in group_vars with sync_from_repo.
training_platform_source_mode: assert_present
training_platform_source_dir: "{{ playbook_dir }}/../subcase_1b/training_platform"
training_platform_sync_delete: false

training_platform_app_dir: /opt/subcase_1b/training_platform
training_platform_venv_path: "{{ training_platform_app_dir }}/.venv"
training_platform_requirements_file: "{{ training_platform_app_dir }}/requirements.txt"
training_platform_entrypoint: "{{ training_platform_app_dir }}/app.py"
training_platform_service_name: training_platform
training_platform_env_file: /etc/default/training_platform
training_platform_service_user: root
training_platform_service_group: root
training_platform_bind_host: 127.0.0.1
training_platform_bind_port: 5000
training_platform_nginx_site: training_platform.conf

# Integration variables written to EnvironmentFile.
training_platform_lti_tool_private_key: ""
training_platform_openedx_url: ""
training_platform_openedx_api_token: ""
training_platform_openedx_session_cookie: ""
training_platform_misp_url: ""
training_platform_misp_api_key: ""
training_platform_kypo_url: ""
training_platform_lti_client_id: ""
training_platform_lti_deployment_id: ""

# Optional validations for external integrations.
training_platform_openedx_enabled: false
training_platform_misp_enabled: false
training_platform_kypo_enabled: false
training_platform_lti_enabled: false
