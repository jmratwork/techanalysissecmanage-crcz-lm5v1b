---
cicms_enabled: true
cicms_install_method: "{{ 'docker' if cicms_docker_enabled else 'deb' }}"

cicms_repo_url: ""
cicms_package_path: ""
cicms_package_checksum: ""
cicms_package_tmp_path: /tmp/cicms-server.deb

cicms_service_name: cicms
cicms_config_path: /etc/cicms/config.yml
cicms_check_connectivity: false
cicms_min_free_kb: 102400

cicms_docker_enabled: false
cicms_docker_project_src: /opt/cicms
cicms_docker_compose_template: docker-compose.yml.j2
cicms_docker_env_template: cicms.env.j2
cicms_docker_image: '__REQUIRED_DOCKER_IMAGE__'
cicms_docker_tag: '__REQUIRED_DOCKER_TAG__'
cicms_docker_container_name: cicms
cicms_docker_ports:
  - "8800:8080"
cicms_docker_volumes: []
cicms_docker_networks:
  - "cicms_net"
cicms_docker_tls_enabled: true
# Safe by default; override in inventory (for labs/dev) if needed.
cicms_docker_tls_cert_src: /etc/cicms/tls/tls.crt
cicms_docker_tls_key_src: /etc/cicms/tls/tls.key
cicms_docker_tls_cert_dest: /run/secrets/tls.crt
cicms_docker_tls_key_dest: /run/secrets/tls.key
cicms_docker_environment: {}
cicms_docker_runtime_env: {}
cicms_docker_wait_for:
  - host: 127.0.0.1
    port: 8800
    timeout: 120

cicms_docker_healthcheck_url: ""
cicms_docker_healthcheck_method: GET
cicms_docker_healthcheck_status:
  - 200
cicms_docker_healthcheck_validate_certs: false
cicms_docker_healthcheck_retries: 10
cicms_docker_healthcheck_delay: 5
