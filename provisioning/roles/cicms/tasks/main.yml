- name: Manage CICMS component
  when: cicms_enabled | bool
  become: yes
  block:
    - name: Validate CICMS installation parameters
      ansible.builtin.assert:
        that:
          - cicms_install_method in ['deb', 'docker']
          - cicms_install_method != 'deb' or cicms_repo_url | length > 0
          - cicms_install_method != 'deb' or cicms_package_path | length > 0
          - cicms_install_method != 'deb' or cicms_package_checksum | length > 0
          - cicms_install_method != 'docker' or cicms_docker_enabled | bool
          - cicms_install_method != 'docker' or cicms_docker_project_src | length > 0
        fail_msg: >-
          Configuración inválida para CICMS. Si usarás deb, define cicms_repo_url, cicms_package_path y
          cicms_package_checksum en provisioning/group_vars/subcase_1b.yml (o en el group_vars/host_vars de tu inventario).
          Si no usarás deb, cambia cicms_install_method a "docker".

    - name: Assert supported OS family for CICMS deb flow
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          CICMS con install_method=deb requiere hosts Debian-family (apt/deb).
          Host detectado: {{ ansible_os_family }} / {{ ansible_distribution }}.
      when: cicms_install_method == 'deb'

    - name: CICMS deb installation flow
      when: cicms_install_method == 'deb'
      block:
        - name: Optionally validate CICMS repository connectivity
          ansible.builtin.uri:
            url: "{{ cicms_repo_url }}"
            method: HEAD
            status_code: [200, 301, 302]
          when: cicms_check_connectivity | bool

        - name: Check free space for CICMS package download
          ansible.builtin.command:
            cmd: "df --output=avail -k /tmp"
          changed_when: false
          register: cicms_tmp_df

        - name: Validate free space threshold for CICMS
          ansible.builtin.assert:
            that:
              - (cicms_tmp_df.stdout_lines[-1] | int) >= (cicms_min_free_kb | int)
            fail_msg: "Not enough free disk space in /tmp for CICMS package download"

        - name: Download CICMS package
          ansible.builtin.get_url:
            url: "{{ cicms_repo_url ~ cicms_package_path }}"
            dest: "{{ cicms_package_tmp_path }}"
            mode: "0644"
            checksum: "{{ cicms_package_checksum }}"

        - name: Install CICMS
          ansible.builtin.apt:
            deb: "{{ cicms_package_tmp_path }}"
            state: present

        - name: Configure CICMS
          ansible.builtin.template:
            src: cicms.conf.j2
            dest: "{{ cicms_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart cicms service

        - name: Enable and start CICMS service
          ansible.builtin.service:
            name: "{{ cicms_service_name }}"
            state: started
            enabled: yes

    - name: CICMS docker installation flow
      when: cicms_install_method == 'docker'
      block:
        - name: Validate CICMS Docker prerequisites
          ansible.builtin.assert:
            that:
              - cicms_docker_project_src | length > 0
              - cicms_docker_compose_template | length > 0
              - cicms_docker_env_template | length > 0
              - cicms_docker_networks is iterable
              - cicms_docker_wait_for is iterable
              - cicms_docker_image | length > 0
              - cicms_docker_tag | length > 0
              - cicms_docker_image != '__REQUIRED_DOCKER_IMAGE__'
              - cicms_docker_tag != '__REQUIRED_DOCKER_TAG__'
            fail_msg: >-
              Faltan variables Docker de CICMS. Define cicms_docker_image y cicms_docker_tag con valores reales en
              provisioning/group_vars/subcase_1b.yml (o en group_vars/host_vars de tu inventario), y verifica
              cicms_docker_project_src/cicms_docker_networks/cicms_docker_wait_for.

        - name: Ensure CICMS Docker project directory exists
          ansible.builtin.file:
            path: "{{ cicms_docker_project_src }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Render CICMS Docker compose file
          ansible.builtin.template:
            src: "{{ cicms_docker_compose_template }}"
            dest: "{{ cicms_docker_project_src }}/docker-compose.yml"
            owner: root
            group: root
            mode: '0644'

        - name: Render CICMS Docker env file
          ansible.builtin.template:
            src: "{{ cicms_docker_env_template }}"
            dest: "{{ cicms_docker_project_src }}/.env"
            owner: root
            group: root
            mode: '0640'

        - name: Ensure CICMS Docker networks exist
          community.docker.docker_network:
            name: "{{ item }}"
            state: present
          loop: "{{ cicms_docker_networks | default([]) }}"

        - name: Deploy CICMS Docker stack
          community.docker.docker_compose_v2:
            project_src: "{{ cicms_docker_project_src }}"
            state: present
          register: cicms_docker_compose_result

        - name: Wait for CICMS Docker endpoints
          ansible.builtin.wait_for:
            host: "{{ item.host | default('127.0.0.1') }}"
            port: "{{ item.port }}"
            timeout: "{{ item.timeout | default(120) }}"
          loop: "{{ cicms_docker_wait_for | default([]) }}"
          when: (cicms_docker_wait_for | default([])) | length > 0

        - name: Validate CICMS Docker health endpoint
          ansible.builtin.uri:
            url: "{{ cicms_docker_healthcheck_url }}"
            method: "{{ cicms_docker_healthcheck_method }}"
            status_code: "{{ cicms_docker_healthcheck_status | default([200]) }}"
            validate_certs: "{{ cicms_docker_healthcheck_validate_certs }}"
          register: cicms_docker_healthcheck_result
          retries: "{{ cicms_docker_healthcheck_retries }}"
          delay: "{{ cicms_docker_healthcheck_delay }}"
          until: cicms_docker_healthcheck_result is succeeded
          when: (cicms_docker_healthcheck_url | default('')) | length > 0

        - name: Debug CICMS deployment summary
          ansible.builtin.debug:
            msg:
              service: CICMS
              method: "{{ cicms_install_method }}"
              compose_path: "{{ cicms_docker_project_src }}/docker-compose.yml"
              compose_result: "{{ cicms_docker_compose_result.actions | default(cicms_docker_compose_result.changed) }}"
