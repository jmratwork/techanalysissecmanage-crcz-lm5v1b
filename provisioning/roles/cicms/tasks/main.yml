- name: Manage CICMS component
  when: cicms_enabled | bool
  become: yes
  block:
    - name: Validate CICMS installation parameters
      ansible.builtin.assert:
        that:
          - cicms_install_method in ['deb', 'docker', 'smb']
          - cicms_install_method != 'deb' or cicms_repo_url | length > 0
          - cicms_install_method != 'deb' or cicms_package_path | length > 0
          - cicms_install_method != 'deb' or cicms_package_checksum | length > 0
          - cicms_install_method != 'docker' or cicms_docker_enabled | bool
          - cicms_install_method != 'docker' or cicms_docker_project_src | length > 0
          - cicms_install_method != 'smb' or cicms_smb_project_src | length > 0
          - cicms_install_method != 'smb' or cicms_smb_bundle_name | length > 0
        fail_msg: >-
          Invalid configuration for CICMS. If you will use deb, define cicms_repo_url, cicms_package_path and
          cicms_package_checksum in provisioning/group_vars/subcase_1b.yml (or in your inventory's group_vars/host_vars).
          If you will not use deb, change cicms_install_method to "docker" or "smb".
          For smb, define cicms_smb_mount_path, cicms_smb_bundle_name, and cicms_smb_project_src.

    - name: Assert supported OS family for CICMS deb flow
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          CICMS with install_method=deb requires Debian-family hosts (apt/deb).
          Detected host: {{ ansible_os_family }} / {{ ansible_distribution }}.
      when: cicms_install_method == 'deb'

    - name: CICMS deb installation flow
      when: cicms_install_method == 'deb'
      block:
        - name: Optionally validate CICMS repository connectivity
          ansible.builtin.uri:
            url: "{{ cicms_repo_url }}"
            method: HEAD
            status_code: [200, 301, 302]
          when: cicms_check_connectivity | bool

        - name: Check free space for CICMS package download
          ansible.builtin.command:
            cmd: "df --output=avail -k /tmp"
          changed_when: false
          register: cicms_tmp_df

        - name: Validate free space threshold for CICMS
          ansible.builtin.assert:
            that:
              - (cicms_tmp_df.stdout_lines[-1] | int) >= (cicms_min_free_kb | int)
            fail_msg: "Not enough free disk space in /tmp for CICMS package download"

        - name: Download CICMS package
          ansible.builtin.get_url:
            url: "{{ cicms_repo_url ~ cicms_package_path }}"
            dest: "{{ cicms_package_tmp_path }}"
            mode: "0644"
            checksum: "{{ cicms_package_checksum }}"

        - name: Install CICMS
          ansible.builtin.apt:
            deb: "{{ cicms_package_tmp_path }}"
            state: present

        - name: Configure CICMS
          ansible.builtin.template:
            src: cicms.conf.j2
            dest: "{{ cicms_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart cicms service

        - name: Enable and start CICMS service
          ansible.builtin.service:
            name: "{{ cicms_service_name }}"
            state: started
            enabled: yes

    - name: CICMS docker installation flow
      when: cicms_install_method == 'docker'
      block:
        - name: Validate CICMS Docker prerequisites
          ansible.builtin.assert:
            that:
              - cicms_docker_project_src | length > 0
              - cicms_docker_compose_template | length > 0
              - cicms_docker_env_template | length > 0
              - cicms_docker_networks is iterable
              - cicms_docker_wait_for is iterable
              - cicms_docker_image | length > 0
              - cicms_docker_tag | length > 0
              - cicms_docker_image != '__REQUIRED_DOCKER_IMAGE__'
              - cicms_docker_tag != '__REQUIRED_DOCKER_TAG__'
            fail_msg: >-
              Docker variables are missing for CICMS. Define cicms_docker_image and cicms_docker_tag with real values in
              provisioning/group_vars/subcase_1b.yml (or in your inventory's group_vars/host_vars), and verify
              cicms_docker_project_src/cicms_docker_networks/cicms_docker_wait_for.

        - name: Ensure CICMS Docker project directory exists
          ansible.builtin.file:
            path: "{{ cicms_docker_project_src }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Render CICMS Docker compose file
          ansible.builtin.template:
            src: "{{ cicms_docker_compose_template }}"
            dest: "{{ cicms_docker_project_src }}/docker-compose.yml"
            owner: root
            group: root
            mode: '0644'

        - name: Render CICMS Docker env file
          ansible.builtin.template:
            src: "{{ cicms_docker_env_template }}"
            dest: "{{ cicms_docker_project_src }}/.env"
            owner: root
            group: root
            mode: '0640'

        - name: Ensure CICMS Docker networks exist
          community.docker.docker_network:
            name: "{{ item }}"
            state: present
          loop: "{{ cicms_docker_networks | default([]) }}"

        - name: Deploy CICMS Docker stack
          community.docker.docker_compose_v2:
            project_src: "{{ cicms_docker_project_src }}"
            state: present
          register: cicms_docker_compose_result

        - name: Wait for CICMS Docker endpoints
          ansible.builtin.wait_for:
            host: "{{ item.host | default('127.0.0.1') }}"
            port: "{{ item.port }}"
            timeout: "{{ item.timeout | default(120) }}"
          loop: "{{ cicms_docker_wait_for | default([]) }}"
          when: (cicms_docker_wait_for | default([])) | length > 0

        - name: Assert CICMS Docker healthcheck strategy is configured
          ansible.builtin.assert:
            that:
              - (cicms_docker_wait_for | default([]) | length > 0) or ((cicms_docker_healthcheck_url | default('')) | length > 0)
            fail_msg: >-
              CICMS Docker deployment requires at least one runtime validation:
              define cicms_docker_wait_for or cicms_docker_healthcheck_url.

        - name: Validate CICMS Docker health endpoint
          ansible.builtin.uri:
            url: "{{ cicms_docker_healthcheck_url }}"
            method: "{{ cicms_docker_healthcheck_method }}"
            status_code: "{{ cicms_docker_healthcheck_status | default([200]) }}"
            validate_certs: "{{ cicms_docker_healthcheck_validate_certs }}"
          register: cicms_docker_healthcheck_result
          retries: "{{ cicms_docker_healthcheck_retries }}"
          delay: "{{ cicms_docker_healthcheck_delay }}"
          until: cicms_docker_healthcheck_result is succeeded
          when:
            - cicms_docker_healthcheck_enabled | bool
            - (cicms_docker_healthcheck_url | default('')) | length > 0

        - name: Explain CICMS healthcheck mode when URL probe is disabled
          ansible.builtin.debug:
            msg: >-
              CICMS Docker HTTP healthcheck skipped (cicms_docker_healthcheck_enabled={{ cicms_docker_healthcheck_enabled }},
              url='{{ cicms_docker_healthcheck_url }}'). Runtime validation relies on wait_for endpoints.
          when:
            - not (cicms_docker_healthcheck_enabled | bool) or (cicms_docker_healthcheck_url | default('')) | length == 0

        - name: Debug CICMS deployment summary
          ansible.builtin.debug:
            msg:
              service: CICMS
              method: "{{ cicms_install_method }}"
              compose_path: "{{ cicms_docker_project_src }}/docker-compose.yml"
              compose_result: "{{ cicms_docker_compose_result.actions | default(cicms_docker_compose_result.changed) }}"

    - name: CICMS SMB bundle installation flow (DFIR-IRIS)
      when: cicms_install_method == 'smb'
      block:
        - name: Ensure DFIR-IRIS project directory exists
          ansible.builtin.file:
            path: "{{ cicms_smb_project_src }}"
            state: directory
            mode: "0755"

        - name: Copy DFIR-IRIS bundle from SMB share
          ansible.builtin.copy:
            src: "{{ cicms_smb_mount_path }}/{{ cicms_smb_bundle_name }}"
            dest: "{{ cicms_smb_bundle_dest }}"
            remote_src: true
            mode: "0644"

        - name: Unzip DFIR-IRIS bundle
          ansible.builtin.unarchive:
            src: "{{ cicms_smb_bundle_dest }}"
            dest: /opt/
            remote_src: true
            extra_opts: ["-o"]

        - name: Configure MISP URL in DFIR-IRIS env
          ansible.builtin.lineinfile:
            path: "{{ cicms_smb_project_src }}/.env"
            regexp: '^IRIS_MISP_URL='
            line: "IRIS_MISP_URL={{ cicms_misp_url }}"
            state: present
          when: cicms_misp_url | length > 0

        - name: Configure MISP SSL verification in DFIR-IRIS env
          ansible.builtin.lineinfile:
            path: "{{ cicms_smb_project_src }}/.env"
            regexp: '^IRIS_MISP_VERIFY_CERT='
            line: "IRIS_MISP_VERIFY_CERT={{ cicms_misp_verify_cert | string | lower }}"
            state: present

        - name: Configure MISP API key in DFIR-IRIS env
          ansible.builtin.lineinfile:
            path: "{{ cicms_smb_project_src }}/.env"
            regexp: '^IRIS_MISP_KEY='
            line: "IRIS_MISP_KEY={{ cicms_misp_api_key }}"
            state: present
          when: cicms_misp_api_key | length > 0

        - name: Deploy DFIR-IRIS Docker stack from SMB bundle
          community.docker.docker_compose_v2:
            project_src: "{{ cicms_smb_project_src }}"
            state: present
            build: always
          register: cicms_smb_compose_result

        - name: Debug CICMS SMB deployment summary
          ansible.builtin.debug:
            msg:
              service: CICMS/DFIR-IRIS
              method: smb
              project_src: "{{ cicms_smb_project_src }}"
              compose_result: "{{ cicms_smb_compose_result.actions | default(cicms_smb_compose_result.changed) }}"
