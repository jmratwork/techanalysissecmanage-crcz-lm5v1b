---
- name: Assert router provisioning is intentionally disabled in this repository
  ansible.builtin.assert:
    that:
      - true
    success_msg: "Router: no active provisioning in this repository."
    quiet: true

- name: Explain router no-op decision
  ansible.builtin.debug:
    msg: "Router: no active provisioning in this repository. Explicit no-op role maintained to avoid ambiguous silence."
