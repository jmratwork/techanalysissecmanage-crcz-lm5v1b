---
bips_enabled: true
bips_install_method: deb

bips_repo_url: ""
bips_package_path: ""
bips_package_checksum: ""
bips_package_tmp_path: /tmp/bips-agent.deb

bips_service_name: bips
bips_config_path: /etc/bips/bips.conf
bips_check_connectivity: false
bips_min_free_kb: 102400

bips_docker_enabled: false
bips_docker_project_src: /opt/bips
bips_docker_compose_template: docker-compose.yml.j2
bips_docker_env_template: bips.env.j2
bips_docker_image: '__REQUIRED_DOCKER_IMAGE__'
bips_docker_tag: '__REQUIRED_DOCKER_TAG__'
bips_docker_container_name: bips
bips_docker_ports:
  - "8600:8080"
bips_docker_volumes: []
bips_docker_networks:
  - "bips_net"
bips_docker_tls_enabled: true
# Safe by default; override in inventory (for labs/dev) if needed.
bips_docker_tls_cert_src: /etc/bips/tls/tls.crt
bips_docker_tls_key_src: /etc/bips/tls/tls.key
bips_docker_tls_cert_dest: /run/secrets/tls.crt
bips_docker_tls_key_dest: /run/secrets/tls.key
bips_docker_environment: {}
bips_docker_runtime_env: {}
bips_docker_wait_for:
  - host: 127.0.0.1
    port: 8600
    timeout: 120

bips_docker_healthcheck_url: ""
bips_docker_healthcheck_enabled: true
bips_docker_healthcheck_method: GET
bips_docker_healthcheck_status:
  - 200
bips_docker_healthcheck_validate_certs: false
bips_docker_healthcheck_retries: 10
bips_docker_healthcheck_delay: 5
