- name: Manage BIPS component
  when: bips_enabled | bool
  become: yes
  block:
    - name: Assert BIPS install mode is explicit and consistent
      ansible.builtin.assert:
        that:
          - bips_install_method in ['deb', 'docker']
          - (bips_install_method == 'docker') == (bips_docker_enabled | bool)
        fail_msg: >-
          Ambiguous BIPS install configuration. Define bips_install_method and bips_docker_enabled consistently in
          group_vars/host_vars (for example: docker+true or deb+false).

    - name: Validate BIPS docker method flag
      ansible.builtin.assert:
        that:
          - bips_docker_enabled | bool
        fail_msg: >-
          bips_docker_enabled must be true when bips_install_method=docker.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'docker'

    - name: Validate BIPS docker image is defined
      ansible.builtin.assert:
        that:
          - bips_docker_image | length > 0
        fail_msg: >-
          bips_docker_image must be defined with a non-empty value.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'docker'

    - name: Validate BIPS docker tag is defined
      ansible.builtin.assert:
        that:
          - bips_docker_tag | length > 0
        fail_msg: >-
          bips_docker_tag must be defined with a non-empty value.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'docker'

    - name: Validate BIPS docker image placeholder is replaced
      ansible.builtin.assert:
        that:
          - bips_docker_image is not regex('__REQUIRED_')
        fail_msg: >-
          bips_docker_image contains a required placeholder (__REQUIRED_...).
          Set a real value in provisioning/group_vars/subcase_1b.yml
          (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'docker'

    - name: Validate BIPS docker tag placeholder is replaced
      ansible.builtin.assert:
        that:
          - bips_docker_tag is not regex('__REQUIRED_')
        fail_msg: >-
          bips_docker_tag contains a required placeholder (__REQUIRED_...).
          Set a real value in provisioning/group_vars/subcase_1b.yml
          (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'docker'

    - name: Validate BIPS deb repository URL is defined
      ansible.builtin.assert:
        that:
          - bips_repo_url | length > 0
        fail_msg: >-
          bips_repo_url must be defined with a non-empty value.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Validate BIPS deb package path is defined
      ansible.builtin.assert:
        that:
          - bips_package_path | length > 0
        fail_msg: >-
          bips_package_path must be defined with a non-empty value.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Validate BIPS deb package checksum is defined
      ansible.builtin.assert:
        that:
          - bips_package_checksum | length > 0
        fail_msg: >-
          bips_package_checksum must be defined with a non-empty value.
          Edit provisioning/group_vars/subcase_1b.yml (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Validate BIPS deb repository URL placeholder is replaced
      ansible.builtin.assert:
        that:
          - bips_repo_url is not regex('__REQUIRED_')
        fail_msg: >-
          bips_repo_url contains a required placeholder (__REQUIRED_...).
          Set a real value in provisioning/group_vars/subcase_1b.yml
          (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Validate BIPS deb package path placeholder is replaced
      ansible.builtin.assert:
        that:
          - bips_package_path is not regex('__REQUIRED_')
        fail_msg: >-
          bips_package_path contains a required placeholder (__REQUIRED_...).
          Set a real value in provisioning/group_vars/subcase_1b.yml
          (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Validate BIPS deb package checksum placeholder is replaced
      ansible.builtin.assert:
        that:
          - bips_package_checksum is not regex('__REQUIRED_')
        fail_msg: >-
          bips_package_checksum contains a required placeholder (__REQUIRED_...).
          Set a real value in provisioning/group_vars/subcase_1b.yml
          (or your inventory's group_vars/host_vars).
      when: bips_install_method == 'deb'

    - name: Assert supported OS family for BIPS deb flow
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          BIPS with install_method=deb requires Debian-family hosts (apt/deb).
          Detected host: {{ ansible_os_family }} / {{ ansible_distribution }}.
      when: bips_install_method == 'deb'

    - name: BIPS deb installation flow
      when: bips_install_method == 'deb'
      block:
        - name: Optionally validate BIPS repository connectivity
          ansible.builtin.uri:
            url: "{{ bips_repo_url }}"
            method: HEAD
            status_code: [200, 301, 302]
          when: bips_check_connectivity | bool

        - name: Check free space for BIPS package download
          ansible.builtin.command:
            cmd: "df --output=avail -k /tmp"
          changed_when: false
          register: bips_tmp_df

        - name: Validate free space threshold for BIPS
          ansible.builtin.assert:
            that:
              - (bips_tmp_df.stdout_lines[-1] | int) >= (bips_min_free_kb | int)
            fail_msg: "Not enough free disk space in /tmp for BIPS package download"

        - name: Download BIPS package
          ansible.builtin.get_url:
            url: "{{ bips_repo_url ~ bips_package_path }}"
            dest: "{{ bips_package_tmp_path }}"
            mode: "0644"
            checksum: "{{ bips_package_checksum }}"

        - name: Install BIPS
          ansible.builtin.apt:
            deb: "{{ bips_package_tmp_path }}"
            state: present

        - name: Configure BIPS
          ansible.builtin.template:
            src: bips.conf.j2
            dest: "{{ bips_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart bips service

        - name: Enable and start BIPS service
          ansible.builtin.service:
            name: "{{ bips_service_name }}"
            state: started
            enabled: yes

    - name: BIPS docker installation flow
      when: bips_install_method == 'docker'
      block:
        - name: Validate BIPS Docker prerequisites
          ansible.builtin.assert:
            that:
              - bips_docker_project_src | length > 0
              - bips_docker_compose_template | length > 0
              - bips_docker_env_template | length > 0
              - bips_docker_networks is iterable
              - bips_docker_wait_for is iterable
            fail_msg: >-
              BIPS Docker variables are missing. Define bips_docker_project_src, bips_docker_compose_template,
              bips_docker_env_template, bips_docker_networks and bips_docker_wait_for in
              provisioning/group_vars/subcase_1b.yml (or in your inventory's group_vars/host_vars), and verify
              their values are valid.

        - name: Ensure BIPS Docker project directory exists
          ansible.builtin.file:
            path: "{{ bips_docker_project_src }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Render BIPS Docker compose file
          ansible.builtin.template:
            src: "{{ bips_docker_compose_template }}"
            dest: "{{ bips_docker_project_src }}/docker-compose.yml"
            owner: root
            group: root
            mode: '0644'

        - name: Render BIPS Docker env file
          ansible.builtin.template:
            src: "{{ bips_docker_env_template }}"
            dest: "{{ bips_docker_project_src }}/.env"
            owner: root
            group: root
            mode: '0640'

        - name: Ensure BIPS Docker networks exist
          community.docker.docker_network:
            name: "{{ item }}"
            state: present
          loop: "{{ bips_docker_networks | default([]) }}"

        - name: Deploy BIPS Docker stack
          community.docker.docker_compose_v2:
            project_src: "{{ bips_docker_project_src }}"
            state: present
          register: bips_docker_compose_result

        - name: Wait for BIPS Docker endpoints
          ansible.builtin.wait_for:
            host: "{{ item.host | default('127.0.0.1') }}"
            port: "{{ item.port }}"
            timeout: "{{ item.timeout | default(120) }}"
          loop: "{{ bips_docker_wait_for | default([]) }}"
          when: (bips_docker_wait_for | default([])) | length > 0

        - name: Assert BIPS Docker healthcheck strategy is configured
          ansible.builtin.assert:
            that:
              - (bips_docker_wait_for | default([]) | length > 0) or ((bips_docker_healthcheck_url | default('')) | length > 0)
            fail_msg: >-
              BIPS Docker deployment requires at least one runtime validation:
              define bips_docker_wait_for or bips_docker_healthcheck_url.

        - name: Validate BIPS Docker health endpoint
          ansible.builtin.uri:
            url: "{{ bips_docker_healthcheck_url }}"
            method: "{{ bips_docker_healthcheck_method }}"
            status_code: "{{ bips_docker_healthcheck_status | default([200]) }}"
            validate_certs: "{{ bips_docker_healthcheck_validate_certs }}"
          register: bips_docker_healthcheck_result
          retries: "{{ bips_docker_healthcheck_retries }}"
          delay: "{{ bips_docker_healthcheck_delay }}"
          until: bips_docker_healthcheck_result is succeeded
          when:
            - bips_docker_healthcheck_enabled | bool
            - (bips_docker_healthcheck_url | default('')) | length > 0

        - name: Explain BIPS healthcheck mode when URL probe is disabled
          ansible.builtin.debug:
            msg: >-
              BIPS Docker HTTP healthcheck skipped (bips_docker_healthcheck_enabled={{ bips_docker_healthcheck_enabled }},
              url='{{ bips_docker_healthcheck_url }}'). Runtime validation relies on wait_for endpoints.
          when:
            - not (bips_docker_healthcheck_enabled | bool) or (bips_docker_healthcheck_url | default('')) | length == 0

        - name: Debug BIPS deployment summary
          ansible.builtin.debug:
            msg:
              service: BIPS
              method: "{{ bips_install_method }}"
              compose_path: "{{ bips_docker_project_src }}/docker-compose.yml"
              compose_result: "{{ bips_docker_compose_result.actions | default(bips_docker_compose_result.changed) }}"
