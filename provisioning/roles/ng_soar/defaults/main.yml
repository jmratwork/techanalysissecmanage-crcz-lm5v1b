---
ng_soar_enabled: true
ng_soar_install_method: "{{ 'docker' if ng_soar_docker_enabled else 'deb' }}"

ng_soar_repo_url: ""
ng_soar_package_path: ""
ng_soar_package_checksum: ""
ng_soar_package_tmp_path: /tmp/ng-soar-platform.deb

ng_soar_service_name: ng-soar
ng_soar_config_path: /etc/ng_soar/config.yml
ng_soar_dashboard_path: /etc/ng_soar/ngsoar-dashboard.ndjson

ng_soar_check_connectivity: false
ng_soar_min_free_kb: 102400

ng_soar_docker_enabled: false
ng_soar_docker_project_src: /opt/ng_soar
ng_soar_docker_compose_template: docker-compose.yml.j2
ng_soar_docker_env_template: ng_soar.env.j2
ng_soar_docker_image: '__REQUIRED_DOCKER_IMAGE__'
ng_soar_docker_tag: '__REQUIRED_DOCKER_TAG__'
ng_soar_docker_container_name: ng_soar
ng_soar_docker_ports:
  - "8900:8443"
ng_soar_docker_volumes: []
ng_soar_docker_networks:
  - "ng_soar_net"
ng_soar_docker_tls_enabled: true
# Safe by default; override in inventory (for labs/dev) if needed.
ng_soar_docker_tls_cert_src: /etc/ng_soar/tls/tls.crt
ng_soar_docker_tls_key_src: /etc/ng_soar/tls/tls.key
ng_soar_docker_tls_cert_dest: /run/secrets/tls.crt
ng_soar_docker_tls_key_dest: /run/secrets/tls.key
ng_soar_docker_environment: {}
ng_soar_docker_runtime_env: {}
ng_soar_docker_wait_for:
  - host: 127.0.0.1
    port: 8900
    timeout: 120

ng_soar_docker_healthcheck_url: ""
ng_soar_docker_healthcheck_enabled: true
ng_soar_docker_healthcheck_method: GET
ng_soar_docker_healthcheck_status:
  - 200
ng_soar_docker_healthcheck_validate_certs: false
ng_soar_docker_healthcheck_retries: 10
ng_soar_docker_healthcheck_delay: 5

# SMB-based yml deployment (NG-SOAR compose file distributed from a shared storage server)
ng_soar_smb_mount_path: /mnt/smb_shared
ng_soar_smb_compose_name: NG-SOAR.yml
ng_soar_smb_project_src: /opt/NG-SOAR
