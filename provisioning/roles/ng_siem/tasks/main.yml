- name: Manage NG-SIEM component
  when: ng_siem_enabled | bool
  become: yes
  block:
    - name: Validate NG-SIEM installation parameters
      ansible.builtin.assert:
        that:
          - ng_siem_install_method in ['deb', 'docker']
          - ng_siem_install_method != 'deb' or ng_siem_repo_url | length > 0
          - ng_siem_install_method != 'deb' or ng_siem_package_path | length > 0
          - ng_siem_install_method != 'deb' or ng_siem_package_checksum | length > 0
          - ng_siem_install_method != 'docker' or ng_siem_docker_enabled | bool
          - ng_siem_install_method != 'docker' or ng_siem_docker_project_src | length > 0
        fail_msg: >-
          Configuración inválida para NG-SIEM. Si usarás deb, define ng_siem_repo_url, ng_siem_package_path y
          ng_siem_package_checksum en provisioning/group_vars/subcase_1b.yml (o en el group_vars/host_vars de tu inventario).
          Si no usarás deb, cambia ng_siem_install_method a "docker".

    - name: Assert supported OS family for NG-SIEM deb flow
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          NG-SIEM con install_method=deb requiere hosts Debian-family (apt/deb).
          Host detectado: {{ ansible_os_family }} / {{ ansible_distribution }}.
      when: ng_siem_install_method == 'deb'

    - name: NG-SIEM deb installation flow
      when: ng_siem_install_method == 'deb'
      block:
        - name: Optionally validate NG-SIEM repository connectivity
          ansible.builtin.uri:
            url: "{{ ng_siem_repo_url }}"
            method: HEAD
            status_code: [200, 301, 302]
          when: ng_siem_check_connectivity | bool

        - name: Check free space for NG-SIEM package download
          ansible.builtin.command:
            cmd: "df --output=avail -k /tmp"
          changed_when: false
          register: ng_siem_tmp_df

        - name: Validate free space threshold for NG-SIEM
          ansible.builtin.assert:
            that:
              - (ng_siem_tmp_df.stdout_lines[-1] | int) >= (ng_siem_min_free_kb | int)
            fail_msg: "Not enough free disk space in /tmp for NG-SIEM package download"

        - name: Download NG-SIEM package
          ansible.builtin.get_url:
            url: "{{ ng_siem_repo_url ~ ng_siem_package_path }}"
            dest: "{{ ng_siem_package_tmp_path }}"
            mode: "0644"
            checksum: "{{ ng_siem_package_checksum }}"

        - name: Install NG-SIEM
          ansible.builtin.apt:
            deb: "{{ ng_siem_package_tmp_path }}"
            state: present

        - name: Configure NG-SIEM
          ansible.builtin.template:
            src: ng_siem.conf.j2
            dest: "{{ ng_siem_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart ng_siem service

        - name: Configure Filebeat
          ansible.builtin.template:
            src: filebeat.yml.j2
            dest: "{{ ng_siem_filebeat_config_path }}"
            owner: root
            group: root
            mode: '0644'
          notify: restart ng_siem service

        - name: Enable and start NG-SIEM service
          ansible.builtin.service:
            name: "{{ ng_siem_service_name }}"
            state: started
            enabled: yes

    - name: NG-SIEM docker installation flow
      when: ng_siem_install_method == 'docker'
      block:
        - name: Validate NG-SIEM Docker prerequisites
          ansible.builtin.assert:
            that:
              - ng_siem_docker_project_src | length > 0
              - ng_siem_docker_compose_template | length > 0
              - ng_siem_docker_env_template | length > 0
              - ng_siem_docker_networks is iterable
              - ng_siem_docker_wait_for is iterable
              - ng_siem_docker_image | length > 0
              - ng_siem_docker_tag | length > 0
              - ng_siem_docker_image != '__REQUIRED_DOCKER_IMAGE__'
              - ng_siem_docker_tag != '__REQUIRED_DOCKER_TAG__'
            fail_msg: >-
              Faltan variables Docker de NG-SIEM. Define ng_siem_docker_image y ng_siem_docker_tag con valores reales en
              provisioning/group_vars/subcase_1b.yml (o en group_vars/host_vars de tu inventario), y verifica
              ng_siem_docker_project_src/ng_siem_docker_networks/ng_siem_docker_wait_for.

        - name: Ensure NG-SIEM Docker project directory exists
          ansible.builtin.file:
            path: "{{ ng_siem_docker_project_src }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Render NG-SIEM Docker compose file
          ansible.builtin.template:
            src: "{{ ng_siem_docker_compose_template }}"
            dest: "{{ ng_siem_docker_project_src }}/docker-compose.yml"
            owner: root
            group: root
            mode: '0644'

        - name: Render NG-SIEM Docker env file
          ansible.builtin.template:
            src: "{{ ng_siem_docker_env_template }}"
            dest: "{{ ng_siem_docker_project_src }}/.env"
            owner: root
            group: root
            mode: '0640'

        - name: Ensure NG-SIEM Docker networks exist
          community.docker.docker_network:
            name: "{{ item }}"
            state: present
          loop: "{{ ng_siem_docker_networks | default([]) }}"

        - name: Deploy NG-SIEM Docker stack
          community.docker.docker_compose_v2:
            project_src: "{{ ng_siem_docker_project_src }}"
            state: present
          register: ng_siem_docker_compose_result

        - name: Wait for NG-SIEM Docker endpoints
          ansible.builtin.wait_for:
            host: "{{ item.host | default('127.0.0.1') }}"
            port: "{{ item.port }}"
            timeout: "{{ item.timeout | default(120) }}"
          loop: "{{ ng_siem_docker_wait_for | default([]) }}"
          when: (ng_siem_docker_wait_for | default([])) | length > 0

        - name: Assert NG-SIEM Docker healthcheck strategy is configured
          ansible.builtin.assert:
            that:
              - (ng_siem_docker_wait_for | default([]) | length > 0) or ((ng_siem_docker_healthcheck_url | default('')) | length > 0)
            fail_msg: >-
              NG-SIEM Docker deployment requires at least one runtime validation:
              define ng_siem_docker_wait_for or ng_siem_docker_healthcheck_url.

        - name: Validate NG-SIEM Docker health endpoint
          ansible.builtin.uri:
            url: "{{ ng_siem_docker_healthcheck_url }}"
            method: "{{ ng_siem_docker_healthcheck_method }}"
            status_code: "{{ ng_siem_docker_healthcheck_status | default([200]) }}"
            validate_certs: "{{ ng_siem_docker_healthcheck_validate_certs }}"
          register: ng_siem_docker_healthcheck_result
          retries: "{{ ng_siem_docker_healthcheck_retries }}"
          delay: "{{ ng_siem_docker_healthcheck_delay }}"
          until: ng_siem_docker_healthcheck_result is succeeded
          when:
            - ng_siem_docker_healthcheck_enabled | bool
            - (ng_siem_docker_healthcheck_url | default('')) | length > 0

        - name: Explain NG-SIEM healthcheck mode when URL probe is disabled
          ansible.builtin.debug:
            msg: >-
              NG-SIEM Docker HTTP healthcheck skipped (ng_siem_docker_healthcheck_enabled={{ ng_siem_docker_healthcheck_enabled }},
              url='{{ ng_siem_docker_healthcheck_url }}'). Runtime validation relies on wait_for endpoints.
          when:
            - not (ng_siem_docker_healthcheck_enabled | bool) or (ng_siem_docker_healthcheck_url | default('')) | length == 0

        - name: Debug NG-SIEM deployment summary
          ansible.builtin.debug:
            msg:
              service: NG-SIEM
              method: "{{ ng_siem_install_method }}"
              compose_path: "{{ ng_siem_docker_project_src }}/docker-compose.yml"
              compose_result: "{{ ng_siem_docker_compose_result.actions | default(ng_siem_docker_compose_result.changed) }}"
