---
ng_siem_enabled: true
ng_siem_install_method: "{{ 'docker' if ng_siem_docker_enabled else 'deb' }}"

ng_siem_repo_url: ""
ng_siem_package_path: ""
ng_siem_package_checksum: ""
ng_siem_package_tmp_path: /tmp/ng-siem-server.deb

ng_siem_service_name: ng-siem
ng_siem_config_path: /etc/ng_siem/config.yml
ng_siem_filebeat_config_path: /etc/ng_siem/filebeat.yml

ng_siem_check_connectivity: false
ng_siem_min_free_kb: 102400

ng_siem_docker_enabled: false
ng_siem_docker_project_src: /opt/ng_siem
ng_siem_docker_compose_template: docker-compose.yml.j2
ng_siem_docker_env_template: ng_siem.env.j2
ng_siem_docker_image: '__REQUIRED_DOCKER_IMAGE__'
ng_siem_docker_tag: '__REQUIRED_DOCKER_TAG__'
ng_siem_docker_container_name: ng_siem
ng_siem_docker_ports:
  - "8700:5601"
ng_siem_docker_volumes: []
ng_siem_docker_networks:
  - "ng_siem_net"
ng_siem_docker_tls_enabled: true
# Safe by default; override in inventory (for labs/dev) if needed.
ng_siem_docker_tls_cert_src: /etc/ng_siem/tls/tls.crt
ng_siem_docker_tls_key_src: /etc/ng_siem/tls/tls.key
ng_siem_docker_tls_cert_dest: /run/secrets/tls.crt
ng_siem_docker_tls_key_dest: /run/secrets/tls.key
ng_siem_docker_environment: {}
ng_siem_docker_runtime_env: {}
ng_siem_docker_wait_for:
  - host: 127.0.0.1
    port: 8700
    timeout: 120

ng_siem_docker_healthcheck_url: ""
ng_siem_docker_healthcheck_method: GET
ng_siem_docker_healthcheck_status:
  - 200
ng_siem_docker_healthcheck_validate_certs: false
ng_siem_docker_healthcheck_retries: 10
ng_siem_docker_healthcheck_delay: 5
