---
- name: Determine whether host platform supports rsyslog-based command logging
  set_fact:
    logging_rsyslog_platform_supported: "{{ ansible_facts.pkg_mgr | default('') == 'apt' }}"

- name: Gather installed package facts for logging backend checks
  package_facts:
    manager: auto
  when: logging_rsyslog_platform_supported

- name: Ensure rsyslog is installed when platform supports command logging
  package:
    name: rsyslog
    state: present
  register: logging_rsyslog_install
  failed_when: >-
    (logging_rsyslog_install is failed) and
    not (
      (logging_rsyslog_install.msg | default('')) is regex('No package matching|has no installation candidate')
    )
  when:
    - logging_rsyslog_platform_supported
    - 'rsyslog' not in (ansible_facts.packages | default({}))

- name: Decide whether rsyslog backend is usable for command logging
  set_fact:
    logging_use_rsyslog: >-
      {{
        logging_rsyslog_platform_supported and
        (
          ('rsyslog' in (ansible_facts.packages | default({}))) or
          (
            (logging_rsyslog_install is defined) and
            not (logging_rsyslog_install.failed | default(false)) and
            not ((logging_rsyslog_install.msg | default('')) is regex('No package matching|has no installation candidate'))
          )
        )
      }}

- name: Configure shell history and command logging
  template:
    src: command_logging.sh.j2
    dest: /etc/profile.d/command_logging.sh
    owner: root
    group: root
    mode: '0644'
  when: logging_use_rsyslog

- name: Configure rsyslog for command logging
  template:
    src: command_logging.conf.j2
    dest: /etc/rsyslog.d/command_logging.conf
    owner: root
    group: root
    mode: '0644'
  when: logging_use_rsyslog
  notify: Restart rsyslog

- name: Explain why rsyslog-based command logging was skipped
  debug:
    msg: >-
      Skipping command logging setup because no supported logging backend is available:
      platform_supported={{ logging_rsyslog_platform_supported | bool }},
      package_manager='{{ ansible_facts.pkg_mgr | default('unknown') }}',
      rsyslog_installed={{ 'rsyslog' in (ansible_facts.packages | default({})) }},
      install_error='{{ logging_rsyslog_install.msg | default('n/a') }}'.
  when: not (logging_use_rsyslog | default(false))
