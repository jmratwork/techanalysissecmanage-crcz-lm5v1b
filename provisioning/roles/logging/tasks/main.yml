---
- name: Ensure rsyslog is installed (apt hosts only)
  package:
    name: rsyslog
    state: present
  register: logging_rsyslog_install
  failed_when: >-
    (logging_rsyslog_install is failed) and
    not (
      (logging_rsyslog_install.msg | default('')) is regex('No package matching|has no installation candidate')
    )
  when: ansible_facts.pkg_mgr == 'apt'

- name: Configure shell history and command logging (apt hosts only)
  template:
    src: command_logging.sh.j2
    dest: /etc/profile.d/command_logging.sh
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts.pkg_mgr == 'apt'

- name: Warn when rsyslog package is unavailable (apt hosts only)
  debug:
    msg: >-
      Skipping rsyslog-based command logging because the rsyslog package is not
      available from apt on this host.
  when:
    - ansible_facts.pkg_mgr == 'apt'
    - (logging_rsyslog_install.msg | default('')) is regex('No package matching|has no installation candidate')

- name: Configure rsyslog for command logging (apt hosts only)
  template:
    src: command_logging.conf.j2
    dest: /etc/rsyslog.d/command_logging.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_facts.pkg_mgr == 'apt'
    - not (logging_rsyslog_install.failed | default(false))
    - not ((logging_rsyslog_install.msg | default('')) is regex('No package matching|has no installation candidate'))
  notify: Restart rsyslog

- name: Skip rsyslog-based command logging on non-apt hosts
  debug:
    msg: >-
      Skipping rsyslog package and configuration because ansible_facts.pkg_mgr
      is '{{ ansible_facts.pkg_mgr | default('unknown') }}' (requires apt).
  when: ansible_facts.pkg_mgr != 'apt'
