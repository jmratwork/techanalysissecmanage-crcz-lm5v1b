---
common_bootstrap_base_packages:
  Debian:
    - ca-certificates
    - curl
    - gnupg
  RedHat:
    - ca-certificates
    - curl
  Suse:
    - ca-certificates
    - curl

common_bootstrap_install_docker: false
common_bootstrap_manage_docker_service: true
common_bootstrap_docker_users: []

common_bootstrap_docker_apt_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64

common_bootstrap_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Docker Hub authentication (for pulling private images)
common_bootstrap_docker_hub_login: false
common_bootstrap_docker_hub_username: ""
common_bootstrap_docker_hub_password: ""

# SMB tools for component distribution from a shared storage server
common_bootstrap_smb_packages:
  - smbclient
  - cifs-utils
  - unzip

common_bootstrap_install_smb_tools: false
common_bootstrap_smb_mount_enabled: false
common_bootstrap_smb_share: ""
common_bootstrap_smb_mount_path: /mnt/smb_shared
common_bootstrap_smb_opts: "guest,vers=3.0"
common_bootstrap_smb_unmount_after: false
