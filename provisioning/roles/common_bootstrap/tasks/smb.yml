---
- name: Install SMB tools for component distribution
  ansible.builtin.apt:
    name: "{{ common_bootstrap_smb_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == 'Debian'

- name: Create SMB mount point
  ansible.builtin.file:
    path: "{{ common_bootstrap_smb_mount_path }}"
    state: directory
    mode: "0775"
  when: common_bootstrap_smb_mount_enabled | bool

- name: Mount SMB share
  ansible.builtin.mount:
    src: "{{ common_bootstrap_smb_share }}"
    path: "{{ common_bootstrap_smb_mount_path }}"
    fstype: cifs
    opts: "{{ common_bootstrap_smb_opts }}"
    state: mounted
  when:
    - common_bootstrap_smb_mount_enabled | bool
    - common_bootstrap_smb_share | length > 0

- name: Unmount SMB share after provisioning
  ansible.builtin.mount:
    path: "{{ common_bootstrap_smb_mount_path }}"
    state: unmounted
  when:
    - common_bootstrap_smb_mount_enabled | bool
    - common_bootstrap_smb_unmount_after | default(false) | bool
