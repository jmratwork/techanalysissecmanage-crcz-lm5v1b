---
- hosts: all
  become: true
  roles:
    - logging


- hosts: training-platform
  become: true
  roles:
    - training_platform


- hosts: trainee-workstation
  become: true
  roles:
    - trainee_workstation

- hosts: cyber-range
  become: true
  roles:
    - cyber_range_setup

- hosts: bips
  become: true
  roles:
    - role: common_bootstrap
      vars:
        common_bootstrap_install_docker: "{{ (bips_install_method | default('deb')) == 'docker' or (bips_docker_enabled | default(false) | bool) }}"
    - bips

- hosts: cicms
  become: true
  roles:
    - role: common_bootstrap
      vars:
        common_bootstrap_install_docker: "{{ (cicms_install_method | default('deb')) == 'docker' or (cicms_docker_enabled | default(false) | bool) }}"
    - cicms

- hosts: ng-siem
  become: true
  roles:
    - role: common_bootstrap
      vars:
        common_bootstrap_install_docker: "{{ (ng_siem_install_method | default('deb')) == 'docker' or (ng_siem_docker_enabled | default(false) | bool) }}"
    - ng_siem

- hosts: ng-soar
  become: true
  roles:
    - role: common_bootstrap
      vars:
        common_bootstrap_install_docker: "{{ (ng_soar_install_method | default('deb')) == 'docker' or (ng_soar_docker_enabled | default(false) | bool) }}"
    - ng_soar

- hosts: randomization-platform
  become: true
  roles:
    - randomization_platform

- hosts: router
  become: true
  roles:
    - router_noop
