# Inventario canónico para Subcaso 1B.
# Mapeo host↔rol (evita regresiones por alias históricos):
# - training_platform      ↔ rol: training_platform
# - trainee_workstation    ↔ rol: trainee_workstation
# - cyber_range            ↔ rol: cyber_range
# - randomization_platform ↔ rol: randomization_platform
# - bips                   ↔ rol: bips
# - ng_siem                ↔ rol: ng_siem
# - cicms                  ↔ rol: cicms
# - ng_soar                ↔ rol: ng_soar
# - router                 ↔ rol: router (si aplica aprovisionamiento en la topología)

[training_platform]
training_platform ansible_host=training_platform

[trainee_workstation]
trainee_workstation ansible_host=trainee_workstation

[cyber_range]
cyber_range ansible_host=cyber_range

[randomization_platform]
randomization_platform ansible_host=randomization_platform

[bips]
bips ansible_host=bips

[ng_siem]
ng_siem ansible_host=ng_siem

[cicms]
cicms ansible_host=cicms

[ng_soar]
ng_soar ansible_host=ng_soar

[router]
router ansible_host=router

# DEPRECADO: no usar el grupo ficticio "soc_server".
# Si apareciera en playbooks/vars heredados, migrar a los grupos canónicos anteriores.

[subcase_1b:children]
training_platform
trainee_workstation
cyber_range
randomization_platform
bips
ng_siem
cicms
ng_soar
router

[subcase_1b:vars]
bips_install_method=docker
bips_docker_enabled=true
bips_docker_image=registry.interna.example/bips
bips_docker_tag=2026.04.0
ng_siem_install_method=docker
ng_siem_docker_enabled=true
ng_siem_docker_image=registry.interna.example/ng-siem
ng_siem_docker_tag=2026.04.0
cicms_install_method=docker
cicms_docker_enabled=true
cicms_docker_image=registry.interna.example/cicms
cicms_docker_tag=2026.04.0
ng_soar_install_method=docker
ng_soar_docker_enabled=true
ng_soar_docker_image=registry.interna.example/ng-soar
ng_soar_docker_tag=2026.04.0
