# Canonical inventory for Subcase 1B.
# Host↔role mapping (avoids regressions due to historical aliases):
# - training-platform      ↔ rol: training_platform
# - trainee-workstation    ↔ rol: trainee_workstation
# - cyber-range            ↔ rol: cyber_range_setup
# - randomization-platform ↔ rol: randomization_platform
# - bips                   ↔ rol: bips
# - ng-siem                ↔ rol: ng_siem
# - cicms                  ↔ rol: cicms
# - ng-soar                ↔ rol: ng_soar
# - router ↔ role: router_noop (no active provisioning in this repository)

[training-platform]
training-platform ansible_host=training-platform

[trainee-workstation]
trainee-workstation ansible_host=trainee-workstation

[cyber-range]
cyber-range ansible_host=cyber-range

[randomization-platform]
randomization-platform ansible_host=randomization-platform

[bips]
bips ansible_host=bips

[ng-siem]
ng-siem ansible_host=ng-siem

[cicms]
cicms ansible_host=cicms

[ng-soar]
ng-soar ansible_host=ng-soar

[router]
router ansible_host=router

# DEPRECADO: no usar el grupo ficticio "soc_server".
# If it appears in legacy playbooks/vars, migrate to the previous canonical groups.

[subcase_1b:children]
training-platform
trainee-workstation
cyber-range
randomization-platform
bips
ng-siem
cicms
ng-soar
router
