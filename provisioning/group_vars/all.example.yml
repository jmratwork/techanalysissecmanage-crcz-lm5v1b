# Copia este archivo a provisioning/group_vars/all.yml antes de ejecutar en docker mode.
# Include global values ​​here that must be shared between groups/hosts.
# Note: training_platform source mode/dir are defined in
# provisioning/group_vars/training-platform.yml (canonical Subcase 1b behavior).

# Example of external integration variables (illustrative placeholders):
OPENEDX_URL: "https://openedx.example.local"
OPENEDX_API_TOKEN: "__REQUIRED_OPENEDX_API_TOKEN__"

# MISP threat intelligence platform.
# If MISP is deployed externally, provide its URL and API key here.
# These values are consumed by cicms (DFIR-IRIS) when cicms_install_method=smb
# to inject IRIS_MISP_URL and IRIS_MISP_KEY into the DFIR-IRIS .env at deploy time.
MISP_URL: "https://misp.example.local"
MISP_API_KEY: "__REQUIRED_MISP_API_KEY__"

# IRIS/DFIR-IRIS case management platform (used by scripts/iris_case_closed_poll.py
# and scripts/rules_to_iris_bridge.py for post-incident automation).
IRIS_URL: "https://iris.example.local"
IRIS_API_KEY: "__REQUIRED_IRIS_API_KEY__"

# SMB shared storage server for component bundle distribution.
# Required when common_bootstrap_install_smb_tools: true.
# Set common_bootstrap_smb_share to the UNC path of the share, e.g.:
#   common_bootstrap_smb_share: "//10.250.232.198/shared"
