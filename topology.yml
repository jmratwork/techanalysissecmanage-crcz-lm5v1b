---
name: subcase-1b-topology

hosts:
  - name: training-platform
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: trainee-workstation
    base_box:
      image: kali
      mgmt_user: debian
    flavor: standard.small

  - name: cyber-range
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: randomization-platform
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: bips
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: ng-siem
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: cicms
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: ng-soar
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

routers:
  - name: router
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.small

networks:
  - name: training_net
    cidr: 10.10.0.0/24

net_mappings:
  - host: training-platform
    network: training_net
    ip: 10.10.0.2
  - host: trainee-workstation
    network: training_net
    ip: 10.10.0.3
  - host: cyber-range
    network: training_net
    ip: 10.10.0.4
  - host: randomization-platform
    network: training_net
    ip: 10.10.0.5
  - host: bips
    network: training_net
    ip: 10.10.0.6
  - host: ng-siem
    network: training_net
    ip: 10.10.0.7
  - host: cicms
    network: training_net
    ip: 10.10.0.8
  - host: ng-soar
    network: training_net
    ip: 10.10.0.9

router_mappings:
  - router: router
    network: training_net
    ip: 10.10.0.1

groups:
  - name: training
    nodes:
      - training-platform
      - trainee-workstation
      - cyber-range
      - randomization-platform
      - bips
      - ng-siem
      - cicms
      - ng-soar
      - router
