---
name: subcase-1b-topology

hosts:
  - name: training-platform
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: trainee-workstation
    base_box:
      image: kali
      mgmt_user: debian
    flavor: standard.small

  - name: cyber-range
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: randomization-platform
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: bips
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: ng-siem
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: cicms
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

  - name: ng-soar
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

networks:
  - name: training-net
    cidr: 10.10.0.0/24
    gateway_ip: 10.10.0.1
    allocation_pool:
      start: 10.10.0.20
      end: 10.10.0.199

net_mappings:
  - host: training-platform
    network: training-net
    ip: 10.10.0.200
  - host: trainee-workstation
    network: training-net
    ip: 10.10.0.201
  - host: cyber-range
    network: training-net
    ip: 10.10.0.202
  - host: randomization-platform
    network: training-net
    ip: 10.10.0.203
  - host: bips
    network: training-net
    ip: 10.10.0.204
  - host: ng-siem
    network: training-net
    ip: 10.10.0.205
  - host: cicms
    network: training-net
    ip: 10.10.0.206
  - host: ng-soar
    network: training-net
    ip: 10.10.0.207

router_mappings:
  - router: router
    network: training-net
    ip: 10.10.0.1

groups:
  - name: training
    nodes:
      - training-platform
      - trainee-workstation
      - cyber-range
      - randomization-platform
      - bips
      - ng-siem
      - cicms
      - ng-soar
      - router
