---
name: subcase-1b-topology

hosts:
  - name: training_platform
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: trainee_workstation
    base_box:
      image: kali
      mgmt_user: debian
    flavor: standard.small

  - name: cyber_range
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: randomization_platform
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: bips
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: ng_siem
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: cicms
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

  - name: ng_soar
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.medium

routers:
  - name: router
    base_box:
      image: debian-11
      mgmt_user: debian
    flavor: standard.small

networks:
  - name: training_net
    cidr: 10.10.0.0/24

net_mappings:
  - host: training_platform
    network: training_net
    ip: 10.10.0.2
  - host: trainee_workstation
    network: training_net
    ip: 10.10.0.3
  - host: cyber_range
    network: training_net
    ip: 10.10.0.4
  - host: randomization_platform
    network: training_net
    ip: 10.10.0.5
  - host: bips
    network: training_net
    ip: 10.10.0.6
  - host: ng_siem
    network: training_net
    ip: 10.10.0.7
  - host: cicms
    network: training_net
    ip: 10.10.0.8
  - host: ng_soar
    network: training_net
    ip: 10.10.0.9

router_mappings:
  - router: router
    network: training_net
    ip: 10.10.0.1

groups:
  - name: training
    nodes:
      - training_platform
      - trainee_workstation
      - cyber_range
      - randomization_platform
      - bips
      - ng_siem
      - cicms
      - ng_soar
      - router
