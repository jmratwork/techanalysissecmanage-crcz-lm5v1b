name: CI

on:
  push:
  pull_request:

jobs:
  lint-yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Run yamllint
        run: yamllint .

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Run ansible-lint on provisioning/
        run: ansible-lint provisioning/

  ansible-syntax-check:
    name: ansible syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Run syntax check
        run: ansible-playbook --syntax-check -i provisioning/inventory.ini provisioning/playbook.yml

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Run pytest
        run: PYTHONPATH=. pytest tests/ soc_alerts/tests/ subcase_1b/training_platform/tests/

  security-basic:
    name: basic security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Run bandit on training platform
        run: bandit -r subcase_1b/training_platform/*.py --exit-zero
